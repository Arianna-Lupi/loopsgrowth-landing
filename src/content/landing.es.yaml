# REGLA DE STATUS AL NACER (para Ari y Camila)
# Cada texto es { text, status }. status es "verified" o "pending".
# Nace "verified" solo en dos casos:
#   (a) el texto ya existe en el doc de Ari o en los documentos del proyecto;
#   (b) es microcopy estructural: nombra un control de la interfaz y no afirma
#       nada del servicio, del proceso, de los plazos, de los resultados ni del equipo.
# Todo lo demás nace "pending". Un "pending" con texto real se muestra tal cual
# en la página; solo donde falta el dato el texto visible es "FALTA CONFIRMAR".
# Nunca hay campos vacíos, etiquetas de borrador ni contenido oculto.
# "reason" y "confirm_by" son metadatos para la lista de pendientes: no se muestran.
# Ante la duda: "pending" y se le pide a Ari.
# La duración y el término viven solo en call.duration y brand.term; las llaves
# {term} y {duration} de las plantillas los inyectan.
es:
  brand:
    name:
      text: "Loops Growth"
      status: verified
    term:
      text: "SEO/GEO"
      status: pending
      reason: "Terminología por confirmar con Ari"
  call:
    duration:
      text: "30 minutos"
      status: pending
      reason: "Duración de la llamada por confirmar"
  cta:
    label_template:
      text: "Agenda tu llamada de {duration}"
      status: verified
  skip:
    nav_label:
      text: "Saltos de página"
      status: verified
    content:
      text: "Saltar al contenido"
      status: verified
    form:
      text: "Saltar al formulario"
      status: verified
  meta:
