      text: "Loops Growth: agencia de {term}"
      status: pending
      reason: "Título provisional derivado de brand.term; la Fase 3 lo reemplaza"
  hero:
    h1:
      text: "Crecemos tu tienda a través de Google, ChatGPT y Gemini."
      status: verified
    subtitle:
      text: "Un equipo dedicado y especializado que ejecuta tu {term} y tu visibilidad en asistentes de IA (ChatGPT, Gemini)."
      status: pending
      reason: "Texto del Copy v2 de Ari; el término sale de brand.term, que está pending"
  agenda:
    title:
      text: "Agenda tu llamada"
      status: verified
    intro:
      text: "Agenda una llamada de {duration}. Sin costo y sin compromiso. Entendemos tu negocio y te decimos con honestidad si podemos ayudarte. Si no somos el equipo correcto, también te lo decimos."
      status: pending
      reason: "Cuerpo del CTA final del Copy v2 de Ari; la duración sale de call.duration, que está pending"
    fallback_lead:
      text: "¿El formulario no carga o prefieres abrirlo aparte?"
      status: verified
    fallback_link:
      text: "Abre el formulario en una pestaña nueva"
      status: verified
    iframe_title:
      text: "Formulario para agendar tu llamada con Loops Growth"
      status: verified
    noscript:
      text: "Para ver el formulario aquí necesitas activar JavaScript."
      status: verified
