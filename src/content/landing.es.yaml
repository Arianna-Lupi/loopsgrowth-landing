    title:
      text: "Preguntas frecuentes"
      status: verified
    items:
      - question:
          text: "¿Cuánto tiempo tarda en dar resultados el SEO?"
          status: verified
        answer:
          text: "SEO y GEO son estrategias de crecimiento a medio y largo plazo.\nNuestro plan está pensado para trabajar en un horizonte de 6 a 12 meses: durante los primeros meses construimos las bases, después empezamos a ver crecimiento y, con el tiempo, ese crecimiento se acumula."
          status: verified
      - question:
          text: "¿Tengo que dejar de invertir en Ads si contrato Loops Growth?"
          status: verified
        answer:
          text: "No.\nNuestro objetivo no es apagar tus campañas de un día para otro, sino ayudarte a construir un canal orgánico que reduzca progresivamente la dependencia de la publicidad paga.\nSEO y Ads pueden trabajar juntos: mientras Ads puede generar resultados de forma inmediata, el SEO construye un activo que puede seguir generando tráfico y clientes con el tiempo."
          status: verified
      - question:
          text: "¿Qué diferencia hay entre ustedes y una agencia SEO tradicional?"
          status: verified
        answer:
          text: "No nos limitamos a entregarte una estrategia y una lista de tareas.\nFuncionamos como un equipo especializado de SEO/GEO: analizamos tu negocio, definimos la estrategia, priorizamos oportunidades y ejecutamos el trabajo técnico, de contenido y autoridad."
          status: verified
      - question:
          text: "¿También trabajan GEO para ChatGPT y Gemini?"
          status: verified
        answer:
          text: "Sí.\nTrabajamos SEO y GEO como parte de una misma estrategia para aumentar las posibilidades de que tu marca aparezca tanto en los resultados de búsqueda tradicionales como en las respuestas de asistentes de IA.\nLa estrategia incluye contenido, estructura, autoridad y otras optimizaciones que ayudan a que estas plataformas puedan encontrar, interpretar y considerar tu negocio como una fuente relevante."
          status: verified
      - question:
          text: "¿Necesito tener un equipo de marketing o SEO interno?"
          status: verified
        answer:
          text: "No necesariamente.\nPrecisamente una de las razones por las que trabajamos con empresas es porque necesitan la capacidad de un equipo especializado sin tener que construirlo internamente.\nSi ya tienes un equipo de marketing, trabajamos con él cuando sea necesario para implementar cambios y coordinar esfuerzos."
          status: verified
      - question:
          text: "¿Qué pasa si ya tengo una estrategia SEO?"
          status: verified
        answer:
          text: "Perfecto. No partimos necesariamente desde cero.\nPrimero analizamos dónde estás, qué se ha hecho, qué está funcionando y qué oportunidades existen. A partir de ahí definimos qué mantener, qué mejorar y qué deberíamos priorizar."
          status: verified
      - question:
          text: "¿Trabajan con cualquier tipo de negocio?"
          status: verified
        answer:
          text: "No necesariamente.\nAntes de comenzar hacemos una llamada para entender tu negocio, objetivos, situación actual y potencial de crecimiento orgánico.\nSi creemos que podemos aportar valor, avanzamos con una auditoría y propuesta. Si no somos el equipo adecuado para tu caso, también te lo diremos."
          status: verified
      - question:
          text: "¿Cuánto cuesta trabajar con Loops Growth?"
          status: verified
        answer:
          text: "La inversión depende del tamaño del proyecto, la situación actual de tu web y el nivel de trabajo necesario.\nDespués de analizar tu negocio y las principales oportunidades, presentamos una propuesta con el alcance, prioridades e inversión.\nNo trabajamos con un paquete idéntico para todos los negocios."
          status: verified
