faq:
  - pregunta: "¿Es demasiado pronto para trabajar el AEO en Colombia?"
    respuesta: |
      El uso de IA es todavía bajo: 18,0 % entre quienes usan internet, según el DANE de 2024. Empezar pronto permite ordenar tu información sin prisa. No esperes un volumen alto de consultas hoy; trabaja para el crecimiento que se ve en los datos.
  - pregunta: "¿Por qué no hablan de cuánta gente usa ChatGPT en Colombia?"
    respuesta: |
      Porque no tenemos una cifra pública verificada. El DANE mide uso de IA en general y no distingue entre herramientas, así que preferimos no inventar un reparto.
  - pregunta: "¿Mi cliente de provincia también usa IA?"
    respuesta: |
      Menos que el de las grandes ciudades. El DANE midió 8,1 % de uso de IA en centros poblados y zona rural dispersa frente a 20,4 % en cabeceras. Ajusta tus expectativas según dónde esté tu público.
  - pregunta: "¿Cómo explico mi servicio sin usar la sigla AEO?"
    respuesta: |
      Descríbelo como el problema que resuelves: que una IA te mencione cuando alguien pregunta por tu categoría. Es el lenguaje que entiende quien aún no sabe qué es la IA y el que mejor encaja con lo que escribe la gente.
