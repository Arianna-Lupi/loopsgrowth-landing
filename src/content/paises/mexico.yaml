faq:
  - pregunta: "¿El SEO sigue valiendo la pena en México si la gente descubre productos en redes?"
    respuesta: |
      Sí, como una pieza del recorrido y no como único canal. AMVO indica que las redes superan a los buscadores como fuente de información de producto, sobre todo entre jóvenes. Por eso conectamos el contenido con lo que la gente ve en redes y medimos cuántas visitas terminan en un mensaje o una compra.
  - pregunta: "¿Trabajan solo para Google o también para Bing?"
    respuesta: |
      Trabajamos sobre todo para Google, que concentra la mayor parte de las búsquedas en México. Como Bing tiene una cuota relevante en la medición de StatCounter, verificamos que tu sitio se pueda rastrear y mostrar bien allí también, sin duplicar el esfuerzo.
  - pregunta: "¿Pueden ayudar a una tienda en línea que depende de WhatsApp para cerrar ventas?"
    respuesta: |
      Sí. Diseñamos las páginas para que el botón de WhatsApp aparezca donde el visitante ya resolvió su duda y medimos cuántas visitas del buscador terminan en esa conversación. Parte del trabajo de una tienda es el [SEO para ecommerce](/servicios/seo-para-ecommerce/).
  - pregunta: "¿Atienden empresas fuera de la Ciudad de México?"
    respuesta: |
      Sí. Trabajamos a distancia con negocios de Monterrey, Guadalajara y de cualquier otro lugar del país. Lo que necesitamos es un sitio que podamos mejorar y un objetivo claro de crecimiento orgánico.
