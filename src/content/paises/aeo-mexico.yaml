faq:
  - pregunta: "¿Qué es AEO dicho en palabras sencillas?"
    respuesta: |
      Es el trabajo de dejar tu información clara y fácil de usar para los asistentes de IA, de modo que puedan tomarla cuando alguien les hace una pregunta sobre tu tema. Puedes verlo como el paso siguiente al SEO, no como un reemplazo. Hay una explicación completa en [qué es AEO](/blog/que-es-aeo/).
  - pregunta: "¿Por qué hablan de Gemini antes que de ChatGPT en México?"
    respuesta: |
      Porque en la medición de StatCounter de octubre de 2026 Gemini concentró más cuota que ChatGPT entre los chatbots en México. La medición cambia cada mes y mide visitas de referencia, no personas, así que la usamos como señal y no como regla fija.
  - pregunta: "¿Pueden asegurar que ChatGPT o Gemini mencionen mi empresa?"
    respuesta: |
      No. Ningún equipo controla lo que responde un asistente de IA. Lo que sí hacemos es ordenar tu información, mejorar cómo se entiende y medir cada mes si empiezan a mencionarte.
  - pregunta: "¿Hace falta tener SEO antes de trabajar el AEO?"
    respuesta: |
      Ayuda mucho, porque las respuestas de IA suelen apoyarse en páginas que ya se pueden rastrear y entender. Si tu sitio tiene problemas técnicos, los resolvemos primero o a la par.
