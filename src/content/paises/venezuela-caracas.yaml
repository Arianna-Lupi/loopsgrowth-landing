  - "Ari: confirmar que la primera llamada es por videollamada (la hoja lo indica) y que el avance mensual llega por escrito."
  - "Regla dura: sin dirección, mapa, LocalBusiness con address ni Google Business mientras no haya oficina. Valencia, Maracaibo y Barquisimeto no tienen página propia."
