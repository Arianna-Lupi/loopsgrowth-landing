faq:
  - pregunta: "¿Trabajan con empresas de Venezuela aunque estén en otra ciudad?"
    respuesta: |
      Sí. Trabajamos de forma remota, por videollamada y con reportes escritos. Lo que importa es que tu negocio tenga una web que podamos mejorar y un objetivo claro de crecimiento orgánico.
  - pregunta: "¿Atienden empresas fuera de Caracas?"
    respuesta: |
      Sí. Atendemos negocios de cualquier ciudad de Venezuela con la misma estrategia. Caracas tiene su propia página porque allí compiten más negocios por las mismas búsquedas.
  - pregunta: "¿Cuánto tarda el SEO en dar resultados?"
    respuesta: |
      Es una estrategia de medio y largo plazo. Pensamos el plan en un horizonte de 6 a 12 meses: primero las bases, después el crecimiento y con el tiempo se acumula.
  - pregunta: "¿Cuál es la inversión?"
    respuesta: |
      La inversión depende de la auditoría. Después de analizar tu negocio presentamos una propuesta con el alcance, las prioridades y la inversión.
