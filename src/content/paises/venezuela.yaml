faq:
  - pregunta: "¿Trabajan con empresas de Venezuela aunque estén en otra ciudad?"
    respuesta: |
      Sí. Trabajamos de forma remota, por videollamada y con reportes escritos. Lo que importa es que tu negocio tenga una web que podamos mejorar y un objetivo claro de crecimiento orgánico.
  - pregunta: "¿Conviene posicionarme en ChatGPT si en Venezuela domina Gemini?"
    respuesta: |
      En la medición de StatCounter de octubre de 2026, Gemini concentraba la mayor cuota de chatbots de IA en el país. Por eso empezamos por Google y sus respuestas de IA y sumamos ChatGPT y Perplexity después. Las cuotas cambian cada mes, así que las revisamos cada cierto tiempo.
  - pregunta: "¿Atienden a venezolanos que viven fuera del país?"
    respuesta: |
      Atendemos negocios venezolanos cuyo público incluye a la diáspora. Ajustamos la estructura del sitio para que se encuentre con búsquedas sin la palabra Venezuela y para que quede claro desde dónde operas.
  - pregunta: "¿Cuánto tarda el SEO en dar resultados?"
    respuesta: |
      Es una estrategia de medio y largo plazo. Pensamos el plan en un horizonte de 6 a 12 meses: primero las bases, después el crecimiento y con el tiempo se acumula. Hay más detalle en esta guía sobre [cuánto tarda el SEO](/blog/cuanto-tarda-el-seo/).
