faq:
  - pregunta: "¿Debo mostrar el pago contra entrega en mi tienda para vender más?"
    respuesta: |
      Según el DANE, tres de cada cuatro compradores en línea pagaron contra entrega en 2024. Si tu logística lo permite, mostrarlo en la ficha y en el pago quita una duda frecuente. Si no lo ofreces, aclara qué medios sí aceptas.
  - pregunta: "¿Las búsquedas por ciudad importan si mi empresa atiende todo el país?"
    respuesta: |
      Pueden importar. Hay gente que añade Bogotá o Medellín al buscar un servicio. Una página que explique cómo atiendes esas ciudades capta esa intención aunque tu equipo trabaje a distancia.
  - pregunta: "¿Qué debo revisar de la Ley 1581 en mi sitio?"
    respuesta: |
      Revisa los formularios, los chats y la medición, y confirma que piden autorización previa e informada antes de tratar datos de una persona. Nosotros señalamos esos puntos en la auditoría, pero no damos asesoría legal.
  - pregunta: "¿Trabajan con empresas fuera de Bogotá y Medellín?"
    respuesta: |
      Sí. Trabajamos de forma remota con negocios de todo el país. Lo importante es que tengas un sitio que podamos mejorar y un objetivo claro de crecimiento orgánico.
