entregables:
  - titulo: Mapa de historias posibles
    texto: Revisamos tu negocio contigo y listamos las historias con hechos comprobables, con una nota sobre qué audiencia se interesaría en cada una.
  - titulo: Lista de medios y sitios del sector
    texto: Un listado de medios, blogs y newsletters donde tu tema encaja, con el tipo de contenido que publica cada uno y a quién contactar.
  - titulo: Material para prensa
    texto: Redactamos el comunicado, el resumen del dato propio o la nota de opinión, y preparamos una versión corta pensada para el editor.
  - titulo: Contacto y seguimiento
    texto: Enviamos las propuestas, damos seguimiento y registramos las respuestas, incluidas las negativas, para ajustar el ángulo.
  - titulo: Registro de menciones obtenidas
    texto: Un documento con cada publicación lograda, el medio, la fecha, si incluye enlace y a qué página de tu sitio apunta.
  - titulo: Informe mensual
    texto: Un resumen por escrito de lo contactado, lo publicado y lo que sigue, con la calidad de cada medio y no solo la cantidad.
proceso:
  - titulo: Encontrar la historia
    texto: Conversamos con tu equipo para encontrar hechos propios que valga la pena contar y descartar lo que solo es publicidad.
  - titulo: Preparar el material
    texto: Armamos el dato, el texto y los respaldos que un editor necesita para decidir rápido si publica o no.
  - titulo: Elegir a quién escribir
    texto: Seleccionamos medios y sitios cuyo público coincide con el tuyo y revisamos su estilo antes de redactar el primer mensaje.
  - titulo: Proponer y dar seguimiento
    texto: Contactamos a cada editor con un ángulo propio, respondemos sus preguntas y registramos lo que sale y lo que no.
  - titulo: Aprovechar lo publicado
    texto: Revisamos que el enlace funcione, enlazamos la cobertura desde tu sitio cuando aporta y medimos qué medios responden mejor.
faq:
  - pregunta: "¿Pagan a los medios por publicar?"
    respuesta: |
      No. Buscamos publicaciones editoriales, que el medio decide por mérito. Un contenido patrocinado es otra cosa y se marca como tal. Para entender los límites de los enlaces pagados, mira nuestro servicio de [link building](/servicios/link-building/).
  - pregunta: "¿Pueden asegurar que un medio publique mi historia?"
    respuesta: |
      No. La decisión es del editor y depende de su agenda y de su audiencia. Lo que sí hacemos es preparar una historia con respaldo y proponerla a las fuentes adecuadas.
  - pregunta: "¿Las menciones ayudan a aparecer en ChatGPT?"
    respuesta: |
      Pueden ayudar a que tu negocio esté descrito en más fuentes que un asistente podría consultar, pero no hay forma de asegurarlo. Nadie controla lo que responde cada plataforma, y lo trabajamos dentro de [posicionamiento en IA](/servicios/posicionamiento-en-ia/).
  - pregunta: "¿Qué pasa si mi empresa todavía no tiene una historia?"
    respuesta: |
      Lo decimos con claridad. A veces el primer paso es crear la historia: un dato propio, una guía mejor que la existente o una posición clara sobre un tema. Antes de salir a contactar medios, una [auditoría de backlinks](/servicios/auditoria-de-backlinks/) también muestra dónde estás hoy.
