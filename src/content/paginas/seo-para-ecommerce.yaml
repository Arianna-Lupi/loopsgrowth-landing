title: "SEO para ecommerce: categorías, fichas y filtros que Google lee"
description: "SEO para ecommerce en español: ordenamos categorías, fichas de producto, filtros y paginación para que Google rastree tu tienda y entienda cada producto."
h1: "SEO para ecommerce: tu tienda online ordenada para Google"
intro: |
  Una tienda online genera URL sin parar: categorías, productos, variantes de talla y color, filtros, páginas de resultados. Esa abundancia es su ventaja y su problema, porque Google tiene que decidir cuáles de esas páginas merecen rastrearse, indexarse y mostrarse.

  En Loops Growth trabajamos el SEO para ecommerce con un orden claro: primero la estructura de la tienda, después las fichas y los datos de producto, y al final el contenido que atrae a quien todavía no sabe qué comprar. Lo hacemos en español para tiendas de LATAM.
secciones:
  - titulo: Categorías y fichas, el centro de la tienda
    cuerpo: |
      Las categorías suelen captar las búsquedas más amplias ("zapatos deportivos para mujer") y las fichas las más específicas ("zapato de running modelo X"). Cada una necesita un propósito distinto y una frase de búsqueda propia, para que no compitan entre sí. Ese reparto se decide con una [investigación de palabras clave](/servicios/investigacion-de-palabras-clave/) hecha por página, no por producto suelto.

      Google recomienda usar [URL con palabras descriptivas](https://developers.google.com/search/docs/specialty/ecommerce/designing-a-url-structure-for-ecommerce-sites) en lugar de números sueltos, usar enlaces `<a href>` en vez de navegación solo con JavaScript y dar a cada página indexable una etiqueta canonical que apunte a sí misma. También indica que una categoría sin productos puede llevar `noindex`, o devolver un 404 si desaparece del todo.
  - titulo: Filtros y facetas sin regalar el rastreo
    cuerpo: |
      Los filtros de color, talla o marca multiplican las URL. Google explica en su guía de [navegación por facetas](https://developers.google.com/search/docs/crawling-indexing/crawling-managing-faceted-navigation) que esas combinaciones pueden ser un conjunto enorme de URL, que los rastreadores no saben si son útiles hasta que las abren, y que ese gasto deja menos tiempo para descubrir páginas nuevas.

      Según esa guía, si no necesitas filtros indexados, puedes bloquear el rastreo de los parámetros en robots.txt. Si sí los necesitas, conviene usar `&` como separador, mantener el mismo orden de filtros y devolver un 404 para las combinaciones sin resultados. Decidimos contigo qué filtros tienen demanda de búsqueda real (por ejemplo "zapatos de cuero negro") y cuáles solo sirven para navegar.
  - titulo: Paginación y variantes
    cuerpo: |
      Cuando una categoría tiene cien productos, se reparte en páginas. Google indica que [cada página debe tener su propia URL y su propio canonical](https://developers.google.com/search/docs/specialty/ecommerce/pagination-and-incremental-page-loading), y que no se debe usar la primera página como canonical de toda la secuencia. También recomienda enlazar cada página con la siguiente mediante `<a href>`.

      Las variantes de un producto (color, talla) se resuelven con otra regla: según Google, cada variante puede tener su URL y, si usas parámetros, el canonical debe ser la versión sin parámetro. Revisamos que tu plataforma haga eso y no deje cientos de copias casi idénticas.
  - titulo: Datos de producto y contenido
    cuerpo: |
      Los datos estructurados de producto ayudan a Google a entender qué vendes. Google distingue entre [fragmentos de producto y fichas de comerciante](https://developers.google.com/search/docs/appearance/structured-data/product): los primeros para páginas donde no se compra directamente y las segundas para páginas donde sí. Añadir los datos no asegura que se muestren.

      Además, una tienda necesita contenido para quien aún compara: guías de compra, comparativas y respuestas a dudas frecuentes. Ese material sale de la [estrategia de contenidos](/servicios/estrategia-de-contenidos/) y se apoya en las búsquedas reales de tus clientes. Si tienes tienda física además de web, mira también el [SEO local y Google Business Profile](/servicios/seo-local-y-google-business-profile/). Si vendes software a empresas, consulta [SEO para SaaS B2B](/servicios/seo-para-saas-b2b/).
senales:
  - Tu tienda tiene miles de URL pero Search Console indexa solo una parte de ellas.
  - Los filtros generan URL con parámetros que aparecen en los resultados de Google.
  - Varias categorías o fichas compiten por las mismas búsquedas y ninguna despunta.
  - Tus fichas de producto repiten la descripción del fabricante palabra por palabra.
  - Las páginas de producto no muestran datos enriquecidos y tu competencia sí.
