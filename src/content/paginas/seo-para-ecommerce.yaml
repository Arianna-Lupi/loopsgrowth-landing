proceso:
  - titulo: Inventario de la tienda
    texto: Listamos las plantillas de página de tu tienda y cuántas URL genera cada una, empezando por categorías y filtros.
  - titulo: Diagnóstico por plantilla
    texto: Revisamos cada tipo de página una sola vez, en lugar de producto por producto, y priorizamos por impacto y esfuerzo.
  - titulo: Reglas para el catálogo
    texto: Definimos cómo se escriben títulos, URL, canonicals y datos de producto para que se apliquen solos a lo nuevo.
  - titulo: Implementación con tu equipo
    texto: Entregamos instrucciones claras para tu desarrollador o tu plataforma y revisamos el resultado antes de darlo por cerrado.
  - titulo: Seguimiento mensual
    texto: Medimos indexación, clics e impresiones por tipo de página en Search Console y ajustamos el plan.
faq:
  - pregunta: "¿Funciona igual en Shopify, WooCommerce o una tienda a medida?"
    respuesta: |
      Los principios son los mismos, pero cada plataforma resuelve distinto las URL, los canonicals y los filtros. Por eso empezamos revisando qué hace tu plataforma por defecto y qué se puede cambiar. A veces el arreglo está en un ajuste y a veces hace falta desarrollo.
  - pregunta: "¿Debo indexar las páginas de filtros?"
    respuesta: |
      Depende de si alguien busca esa combinación. Una página de "zapatos de cuero negro" puede tener demanda propia y merecer URL indexable. Un filtro por orden de llegada no. Decidimos caso por caso con tus datos de búsqueda y la guía de Google sobre [navegación por facetas](https://developers.google.com/search/docs/crawling-indexing/crawling-managing-faceted-navigation).
  - pregunta: "¿Los datos estructurados me aseguran datos enriquecidos en Google?"
    respuesta: |
      No. Google los usa para entender la página y puede mostrar o no elementos enriquecidos. Los implementamos bien porque son la base para que existan esas opciones, sin prometer cómo se verán.
  - pregunta: "¿Por dónde conviene empezar?"
    respuesta: |
      Por la estructura: categorías y filtros. Si Google gasta su atención en miles de URL sin valor, mejorar las fichas rinde menos. Para el orden completo, empieza con la [investigación de palabras clave](/servicios/investigacion-de-palabras-clave/) de tus categorías principales.
