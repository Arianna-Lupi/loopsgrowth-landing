title: "Migración SEO: cambia de dominio, CMS o diseño sin perder"
description: "Servicio de migración SEO para cambios de dominio, CMS o rediseño: mapa de redirecciones, pruebas antes y después y un plan de contingencia."
h1: "Migración SEO: cambio de dominio, CMS o rediseño con control"
intro: |
  Cambiar de dominio, de plataforma o de diseño mueve las URL, los títulos, los enlaces internos y la estructura del sitio. Si Google no entiende ese cambio, las páginas que hoy te traen visitas pueden perder visibilidad. Una migración SEO existe para que ese riesgo se planifique, se pruebe y se pueda revertir.

  En Loops Growth acompañamos el proyecto desde antes de que el equipo de desarrollo toque nada, durante el lanzamiento y en las semanas posteriores.
secciones:
  - titulo: Qué cambia en cada tipo de migración
    cuerpo: |
      No todas las migraciones pesan igual, y tratarlas igual es un error:

      - Cambio de dominio: todas las URL cambian de ubicación. Es el caso con más riesgo y el único donde aplica la herramienta Change of Address de Search Console.
      - Cambio de CMS o de plataforma: las URL pueden mantenerse o no, pero la plantilla, los metadatos y los datos estructurados casi siempre cambian.
      - Rediseño: la estructura de navegación, los enlaces internos y el contenido visible se reorganizan.
      - Paso de HTTP a HTTPS o de www a sin www: Google indica que estos cambios no requieren la herramienta Change of Address de Search Console.
  - titulo: El mapa de redirecciones
    cuerpo: |
      Es la pieza central. Según la [guía de Google sobre mudanzas de sitio](https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes), hay que armar la lista de URL antiguas a partir de sitemaps, registros del servidor, analítica o el propio CMS, e incluir imágenes y otros archivos. Cada URL antigua necesita su destino.

      Google advierte que enviar muchas páginas a un destino no relacionado, como la página de inicio, puede tratarse como soft 404. Recomienda redirecciones permanentes del servidor, como 301 o 308, directas al destino final y con cadenas cortas.

      Armamos ese mapa por plantilla, con una auditoría previa como la de nuestro servicio de [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/).
  - titulo: Pruebas antes y después
    cuerpo: |
      Antes del lanzamiento probamos el entorno de pruebas: que las redirecciones respondan como esperamos, que no queden etiquetas noindex ni bloqueos de robots.txt heredados y que el contenido eliminado devuelva 404 o 410. Google recomienda justamente comprobar estos puntos.

      Después del lanzamiento comparamos con la línea base: páginas indexadas, errores de rastreo y rendimiento en Search Console. También revisamos la [indexación y el rastreo](/servicios/indexacion-y-rastreo/) y las métricas de [Core Web Vitals](/servicios/core-web-vitals/), porque una plantilla nueva puede cambiarlas.
  - titulo: Plan de contingencia
    cuerpo: |
      Una migración sin plan de reversa depende de la suerte. Definimos antes del lanzamiento qué señales indican un problema serio, quién decide y qué se hace: corregir redirecciones, restaurar una plantilla o volver atrás.

      Google también recomienda mantener las redirecciones al menos un año. Dejamos ese compromiso por escrito en el plan, junto con la actualización de enlaces internos y externos importantes. Para entender cómo Google procesa las páginas después del cambio, lee [cómo indexar una página en Google](/blog/como-indexar-una-pagina-en-google/) y [Core Web Vitals: qué son](/blog/core-web-vitals-que-son/).
