proceso:
  - titulo: Inventario y línea base
    texto: Reunimos todas las URL actuales y medimos su estado antes del cambio para tener con qué comparar.
  - titulo: Mapa de redirecciones
    texto: Asignamos un destino a cada URL antigua, cuidando que la correspondencia sea de contenido equivalente.
  - titulo: Pruebas en entorno de pruebas
    texto: Revisamos redirecciones, etiquetas y bloqueos antes de publicar, y devolvemos una lista de correcciones.
  - titulo: Lanzamiento y vigilancia
    texto: Acompañamos el día del cambio, enviamos el sitemap nuevo y revisamos Search Console en las semanas siguientes.
  - titulo: Cierre y mantenimiento
    texto: Entregamos el informe final y dejamos acordado cuánto tiempo se mantienen las redirecciones.
faq:
  - pregunta: "¿Una migración puede hacerse sin perder visibilidad?"
    respuesta: |
      Nadie puede asegurar que no haya fluctuaciones. Lo que sí se hace es reducir el riesgo con un mapa de redirecciones completo, pruebas previas y vigilancia posterior. Empieza por una [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/) del sitio actual.
  - pregunta: "¿Cuánto tiempo hay que mantener las redirecciones?"
    respuesta: |
      Google recomienda mantenerlas al menos un año, para que pueda transferir las señales y recorrer los enlaces que apuntan a las URL antiguas. Lo explica en su [guía de mudanza de sitio](https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes).
  - pregunta: "¿Necesito usar la herramienta Change of Address de Search Console?"
    respuesta: |
      Solo si cambias de dominio o de subdominio. No hace falta para pasar de HTTP a HTTPS ni para cambiar entre www y sin www, según Google.
  - pregunta: "¿Qué reviso después del lanzamiento?"
    respuesta: |
      Páginas indexadas, errores de rastreo y rendimiento, comparados con la línea base. Todo eso se cubre en [indexación y rastreo](/servicios/indexacion-y-rastreo/), y la velocidad de la plantilla nueva se revisa en [Core Web Vitals](/servicios/core-web-vitals/).
