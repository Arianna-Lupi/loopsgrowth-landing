faq:
  - pregunta: "¿Qué rastreador debo permitir para aparecer en ChatGPT?"
    respuesta: |
      OpenAI indica que OAI-SearchBot es el agente que muestra sitios en las funciones de búsqueda de ChatGPT, y que bloquearlo te saca de esas respuestas. Los detalles están en su [documentación de rastreadores](https://developers.openai.com/api/docs/bots). Permitirlo no asegura que aparezcas.
  - pregunta: "¿Bloquear GPTBot me saca de ChatGPT?"
    respuesta: |
      Según OpenAI, GPTBot se relaciona con el entrenamiento de modelos, y la visibilidad en la búsqueda de ChatGPT depende de OAI-SearchBot. Son controles separados y revisamos tu configuración para que cada uno haga lo que decidiste.
  - pregunta: "¿Pueden asegurar que Perplexity me cite?"
    respuesta: |
      No. Perplexity decide con sus propios criterios y su documentación de rastreadores no detalla cómo elige fuentes. Lo que podemos hacer es permitir su rastreador si lo quieres, preparar páginas claras y medir cada mes lo que ocurre, con una [medición de menciones en IA](/servicios/medicion-de-menciones-en-ia/).
  - pregunta: "¿Esto sirve también para Google?"
    respuesta: |
      Google funciona con sus propias reglas, que son distintas. Para ese caso, revisa [optimización para AI Overviews](/servicios/optimizacion-para-ai-overviews/). Un buen SEO ayuda en ambos frentes.
