description: "Optimización para ChatGPT y Perplexity: revisamos sus rastreadores, tus páginas citables y tus menciones, y te decimos con claridad qué controlas y qué no."
h1: "Optimización para ChatGPT y Perplexity: qué se controla y qué no"
intro: |
  ChatGPT y Perplexity pueden buscar en la web y enlazar las páginas que usan para responder. Que tu negocio aparezca ahí depende en parte de cosas que puedes controlar, como permitir que sus rastreadores lean tu sitio, y en parte de decisiones que toma cada plataforma.

  En Loops Growth trabajamos la parte que sí se puede controlar y te explicamos con claridad el resto. Lo hacemos en español, para empresas de LATAM y dentro de tu estrategia de [posicionamiento en IA](/servicios/posicionamiento-en-ia/).
secciones:
  - titulo: Los rastreadores de OpenAI
    cuerpo: |
      OpenAI documenta [tres agentes distintos](https://developers.openai.com/api/docs/bots). OAI-SearchBot sirve para mostrar sitios en las funciones de búsqueda de ChatGPT, y los sitios que lo bloquean no aparecen en esas respuestas. GPTBot rastrea contenido que puede usarse para entrenar modelos, y bloquearlo indica que tu contenido no debe usarse para eso.

      ChatGPT-User actúa cuando una persona pide algo concreto, como abrir una página, y OpenAI aclara que las reglas de robots.txt pueden no aplicarse a esas acciones. Son decisiones separadas: puedes permitir la búsqueda y bloquear el entrenamiento. OpenAI indica que un cambio en robots.txt puede tardar cerca de 24 horas en reflejarse para la búsqueda.
  - titulo: Los rastreadores de Perplexity
    cuerpo: |
      Perplexity [documenta](https://docs.perplexity.ai/guides/bots) PerplexityBot, que sirve para mostrar y enlazar sitios en sus resultados y que, según la empresa, no se usa para rastrear contenido para modelos de fundación. Si quieres aparecer ahí, conviene permitirlo en robots.txt.

      Perplexity-User actúa cuando alguien hace una consulta y la plataforma visita una página para responder. Perplexity señala que, como la solicitud la inicia un usuario, este agente generalmente ignora las reglas de robots.txt. También indica que los cambios pueden tardar hasta 24 horas en reflejarse.
  - titulo: Páginas que se pueden citar
    cuerpo: |
      Un asistente que enlaza una fuente necesita encontrar en ella una respuesta clara. Eso lo controlas tú. Una página citable responde una pregunta concreta al principio, explica el detalle con ejemplos, muestra quién la escribe y mantiene los datos al día.

      Para preguntas de tu sector como "qué agencia elegir" o "cuánto tarda un proyecto de SEO", una página con respuesta directa y criterio propio le da al asistente algo claro que usar. No sabemos qué página elegirá cada plataforma, pero una página vaga no tiene opciones.
  - titulo: Menciones y lo que no se controla
    cuerpo: |
      Lo que otras fuentes dicen de tu negocio también cuenta, y lo trabajamos con [relaciones públicas digitales](/servicios/relaciones-publicas-digitales/). Pero en la documentación de ambas plataformas no encontramos una lista de factores que decida quién aparece, y las respuestas cambian de una consulta a otra.

      Por eso medimos con una batería fija de preguntas, como describimos en la [medición de menciones en IA](/servicios/medicion-de-menciones-en-ia/). Para Google, que funciona distinto, mira [optimización para AI Overviews](/servicios/optimizacion-para-ai-overviews/). Y si quieres entender los conceptos, tenemos guías sobre [qué es AEO](/blog/que-es-aeo/) y [qué es GEO](/blog/que-es-geo-optimizacion-para-motores-generativos/).
