faq:
  - pregunta: "¿Puedo tener una ficha de Google si trabajo desde casa?"
    respuesta: |
      Sí, si visitas a tus clientes. Según las pautas de Google, un negocio que trabaja desde casa puede ocultar su ubicación y usar una ficha de área de servicio. Lo que no sirve es un buzón remoto o un espacio virtual donde no atiendes. Revisamos cuál es tu caso antes de crear nada.
  - pregunta: "¿Se puede pagar a Google para salir primero en el mapa?"
    respuesta: |
      No. Google afirma que no existe forma de pedir ni pagar por una mejor posición local. Lo que sí se trabaja es la relevancia, la coherencia de tus datos y la presencia de tu negocio en la web. Empieza por tu [investigación de palabras clave](/servicios/investigacion-de-palabras-clave/) local.
  - pregunta: "¿Necesito una página por cada ciudad?"
    respuesta: |
      Solo si tienes algo propio que decir en cada una. Si atiendes en tres ciudades con el mismo servicio y sin diferencias, una página bien hecha con la ficha de cada local suele bastar. Una página copiada y adaptada empeora la situación. Mira también el [SEO para ecommerce](/servicios/seo-para-ecommerce/) si compartes catálogo entre ciudades.
  - pregunta: "¿Qué pasa si mi negocio no tiene local?"
    respuesta: |
      Entonces probablemente no te corresponde una ficha de local. Si vendes solo en línea, el trabajo se parece más a un SEO general. Si tienes software para empresas, revisa el [SEO para SaaS B2B](/servicios/seo-para-saas-b2b/).
