faq:
  - pregunta: "¿Pueden asegurar que ChatGPT me recomiende?"
    respuesta: |
      No. Nadie puede asegurarlo, porque cada asistente decide con sus propios criterios y esos criterios cambian. Lo que hacemos es aumentar las razones por las que un asistente te conozca, te encuentre y te considere como fuente, y medir cada mes si eso se refleja.
  - pregunta: "¿Qué diferencia hay entre posicionamiento en IA, GEO y AEO?"
    respuesta: |
      En la práctica, ninguna. Son nombres para el mismo trabajo: lograr que los asistentes de IA mencionen y citen tu negocio. Usamos posicionamiento en IA porque es la forma en que la mayoría lo busca en español.
  - pregunta: "¿Necesito SEO si ya quiero aparecer en la IA?"
    respuesta: |
      Sí, y se trabajan juntos. Un sitio que Google no puede rastrear o entender tampoco es fácil de leer para un asistente. Por eso tratamos SEO y posicionamiento en IA como una sola estrategia.
  - pregunta: "¿Cuánto tarda en verse el avance?"
    respuesta: |
      Es un trabajo de medio y largo plazo, igual que el SEO. Nuestro plan se piensa en un horizonte de 6 a 12 meses: primero las bases, después el crecimiento y con el tiempo se acumula.
  - pregunta: "¿Cuál es la inversión?"
    respuesta: |
      La inversión depende de la auditoría. Después de analizar tu negocio y tus oportunidades, presentamos una propuesta con el alcance, las prioridades y la inversión. No trabajamos con un paquete idéntico para todos.
