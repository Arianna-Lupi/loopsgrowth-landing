medicion:
  titulo: Cómo medimos el avance
  cuerpo: |
    Definimos una batería fija de preguntas que haría un cliente antes de comprarte y la repetimos cada mes, en los mismos asistentes.

    Las respuestas de un asistente cambian de una consulta a otra. Por eso miramos la tendencia a lo largo de los meses y no una sola respuesta. Esta medición convive con tus métricas de SEO en Search Console y en tu analítica.
  registro:
    - Si el asistente te menciona
    - Si te cita como fuente
    - Qué otras fuentes y marcas aparecen
    - Cómo cambia la tendencia mes a mes
faq:
  - pregunta: "¿Pueden asegurar que ChatGPT me recomiende?"
    respuesta: |
      No. Nadie puede asegurarlo, porque cada asistente decide con sus propios criterios y esos criterios cambian. Lo que hacemos es aumentar las razones por las que un asistente te conozca, te encuentre y te considere como fuente, y medir cada mes si eso se refleja.
  - pregunta: "¿Qué diferencia hay entre posicionamiento en IA, GEO y AEO?"
    respuesta: |
      En la práctica, ninguna. Son nombres para el mismo trabajo: lograr que los asistentes de IA mencionen y citen tu negocio. Usamos posicionamiento en IA porque es la forma en que la mayoría lo busca en español.
  - pregunta: "¿Necesito SEO si ya quiero aparecer en la IA?"
    respuesta: |
      Sí, y se trabajan juntos. Un sitio que Google no puede rastrear o entender tampoco es fácil de leer para un asistente. Por eso [Arianna Lupi](/equipo/arianna-lupi/) y su equipo tratan SEO y posicionamiento en IA como una sola estrategia.
  - pregunta: "¿Cuánto tarda en verse el avance?"
    respuesta: |
      Es un trabajo de medio y largo plazo, igual que el SEO. Nuestro plan se piensa en un horizonte de 6 a 12 meses: primero las bases, después el crecimiento y con el tiempo se acumula.
  - pregunta: "¿Cuál es la inversión?"
    respuesta: |
      La inversión depende de la auditoría. Después de analizar tu negocio y tus oportunidades, presentamos una propuesta con el alcance, las prioridades y la inversión. No trabajamos con un paquete idéntico para todos.
  - pregunta: "¿Tienen que rehacer mi web?"
    respuesta: |
      No como punto de partida. Primero revisamos qué pueden leer los rastreadores y qué entiende un asistente sobre tu negocio. Con ese diagnóstico decides qué cambios hacer y en qué orden.
  - pregunta: "¿Qué recibo cada mes?"
    respuesta: |
      Un resumen escrito de lo que hicimos y de lo que se movió, junto con el resultado de la batería de preguntas: si el asistente te menciona, si te cita y qué otras fuentes y marcas aparecen.
