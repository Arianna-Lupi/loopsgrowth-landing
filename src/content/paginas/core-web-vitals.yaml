  - titulo: Reproducción en laboratorio
    texto: Probamos esas plantillas con herramientas de laboratorio, en perfil móvil y con conexión limitada, para encontrar la causa.
  - titulo: Plan de cambios
    texto: Convertimos las causas en una lista de correcciones, cada una asociada a la métrica que debería mover.
