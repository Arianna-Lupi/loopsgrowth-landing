faq:
  - pregunta: "¿Cuáles son los umbrales de Core Web Vitals?"
    respuesta: |
      Google considera buena la experiencia con LCP de 2,5 segundos o menos, INP de 200 milisegundos o menos y CLS de 0,1 o menos, medidos en el percentil 75. Lo detalla [web.dev](https://web.dev/articles/vitals). Tienes la explicación completa en [Core Web Vitals: qué son](/blog/core-web-vitals-que-son/).
  - pregunta: "¿Por qué mi sitio saca buena nota en Lighthouse y mal en Search Console?"
    respuesta: |
      Porque Lighthouse es una prueba de laboratorio y Search Console muestra datos de visitantes reales, con sus dispositivos y sus conexiones. Los datos de campo son la referencia principal. Si quieres entender cómo se conecta con el resto, revisa la [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/).
  - pregunta: "¿Mejorar Core Web Vitals me asegura subir en Google?"
    respuesta: |
      No. Mejora la experiencia de quien visita tu página, pero nadie puede asegurar una posición. El ranking depende de muchos factores, y la relevancia del contenido pesa de forma central.
  - pregunta: "¿Qué pasa si mi página ni siquiera se indexa?"
    respuesta: |
      Entonces el primer paso es otro. Antes de optimizar la velocidad, resolvemos por qué Google no la indexa, dentro del servicio de [indexación y rastreo](/servicios/indexacion-y-rastreo/). Si estás por rediseñar o cambiar de plataforma, lo medimos antes y después en la [migración SEO](/servicios/migracion-seo/).
