title: "Core Web Vitals: mejora LCP, INP y CLS con datos reales"
description: "Servicio de Core Web Vitals: medimos LCP, INP y CLS con datos de campo, priorizamos los cambios que mueven cada métrica y verificamos la mejora."
h1: "Core Web Vitals: LCP, INP y CLS medidos con datos de campo"
intro: |
  Core Web Vitals son tres métricas con las que Google describe la experiencia real de quien visita tu página: cuánto tarda en verse el contenido principal, qué tan rápido responde a un toque y cuánto se mueve el diseño mientras carga. El trabajo consiste en medirlas bien y corregir lo que de verdad las empeora.

  En Loops Growth partimos de datos de campo, los que generan tus visitantes reales, y usamos las pruebas de laboratorio para encontrar la causa. Probamos siempre con perfil móvil y conexión limitada, porque muchos de tus visitantes entran desde el teléfono.
secciones:
  - titulo: Las tres métricas y su umbral
    cuerpo: |
      Según la [documentación de Google en web.dev](https://web.dev/articles/vitals), una página tiene buena experiencia cuando cumple tres objetivos: LCP de 2,5 segundos o menos, INP de 200 milisegundos o menos y CLS de 0,1 o menos. La evaluación se hace en el percentil 75 de las cargas de página, separando móvil y escritorio.

      - LCP (Largest Contentful Paint): mide la carga del elemento principal, normalmente una imagen grande o un bloque de texto.
      - INP (Interaction to Next Paint): mide la capacidad de respuesta cuando alguien toca, hace clic o escribe.
      - CLS (Cumulative Layout Shift): mide la estabilidad visual, es decir, cuánto saltan los elementos mientras la página carga.
  - titulo: Datos de campo frente a laboratorio
    cuerpo: |
      Una prueba de laboratorio simula una visita en condiciones controladas. Sirve para depurar, pero web.dev aclara que Core Web Vitals son principalmente métricas de campo y que la medición de laboratorio no las sustituye. Lighthouse, por ejemplo, no puede medir INP porque no interactúa con la página, y usa otra métrica como aproximación.

      Por eso empezamos por el informe de Core Web Vitals de [Search Console](https://support.google.com/webmasters/answer/9205520), que usa datos de usuarios reales, agrupa las URL con experiencia similar y separa móvil y escritorio, y por los datos de usuarios reales. Después reproducimos el problema en laboratorio para saber qué lo provoca.
  - titulo: Qué cambios suelen mover cada métrica
    cuerpo: |
      Cada métrica responde a causas distintas, y por eso no existe una receta única:

      - Para LCP revisamos el peso y el formato de la imagen principal, la prioridad de carga, el tiempo de respuesta del servidor y los recursos que bloquean el renderizado.
      - Para INP revisamos el JavaScript pesado, los scripts de terceros y los manejadores de eventos lentos.
      - Para CLS revisamos imágenes y anuncios sin dimensiones reservadas, fuentes que cambian el texto al cargar y bloques que se insertan tarde.

      Los cambios se aplican por plantilla, igual que en una [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/). Para el concepto desde cero, lee [Core Web Vitals: qué son](/blog/core-web-vitals-que-son/).
  - titulo: Cómo se relaciona con indexación y migraciones
    cuerpo: |
      Una página lenta no siempre deja de indexarse, pero sí empeora la experiencia de quien llega. La velocidad convive con el resto del trabajo técnico: si primero hay que resolver por qué Google no indexa tus páginas, ve a [indexación y rastreo](/servicios/indexacion-y-rastreo/). Y si vas a cambiar de plataforma, mide antes y después dentro de una [migración SEO](/servicios/migracion-seo/).

      Para repasar el camino completo de una URL, desde que se publica hasta que Google la muestra, consulta [cómo indexar una página en Google](/blog/como-indexar-una-pagina-en-google/).
