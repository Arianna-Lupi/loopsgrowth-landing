h1: "Optimización de contenido existente: actualizar, consolidar o eliminar"
intro: |
  Antes de escribir más, conviene mirar lo que ya tienes. Muchos sitios acumulan artículos desactualizados, páginas que compiten por la misma búsqueda y textos que dejaron de recibir visitas sin que nadie lo notara.

  La optimización de contenido existente de Loops Growth revisa ese inventario página por página y decide, con criterios claros, qué se actualiza, qué se une con otra y qué se retira. Trabajamos en español para empresas de LATAM.
secciones:
  - titulo: Cómo detectamos el contenido que cayó
    cuerpo: |
      Partimos de tus datos en Search Console y en tu analítica. Comparamos periodos para encontrar páginas que recibían impresiones o visitas y ahora reciben menos. Después buscamos la causa, que puede ser distinta en cada caso:

      - El contenido quedó viejo y otras páginas lo superaron.
      - Cambió la intención de la búsqueda y tu formato ya no encaja.
      - Una página nueva de tu propio sitio le quitó el lugar.
      - Un cambio técnico, como una redirección o un enlace roto, afectó la página.

      Antes de tocar nada, confirmamos cuál de estas causas aplica. Actualizar una página cuyo problema era técnico es trabajo perdido.
  - titulo: Contenido que compite contra sí mismo
    cuerpo: |
      Cuando dos páginas de tu sitio responden a la misma búsqueda, Google tiene que elegir una y a veces alterna entre ambas. Eso diluye el rendimiento de las dos. Lo detectamos cruzando las búsquedas de Search Console con las URL que aparecen para cada una.

      La solución depende del caso. Si las dos páginas dicen casi lo mismo, se unen en la más fuerte y la otra se redirige. Si responden a intenciones distintas, se separan con claridad y se enlazan entre sí. El [mapa de palabras clave](/servicios/investigacion-de-palabras-clave/) deja registrada esa asignación para que no vuelva a pasar.
  - titulo: "Criterios para decidir: actualizar, consolidar o eliminar"
    cuerpo: |
      Aplicamos reglas simples a cada página, que revisamos contigo:

      - Actualizar: el tema sigue siendo relevante y la página aún tiene una base que vale la pena mejorar.
      - Consolidar: existe otra página más fuerte sobre lo mismo y unir ambas da un texto mejor.
      - Eliminar o redirigir: la página ya no tiene sentido para tu negocio ni para ninguna búsqueda real.

      Google recomienda crear contenido pensado para las personas, y su guía de [contenido útil](https://developers.google.com/search/docs/fundamentals/creating-helpful-content) sirve de vara para revisar cada página. Una página que no ayuda a nadie no necesita más palabras, necesita una decisión.
  - titulo: Qué ocurre después de decidir
    cuerpo: |
      Cada acción queda en un plan con orden de trabajo. Las páginas que se actualizan siguen el mismo estándar que los textos nuevos de la [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/), y los cambios se alinean con la [estrategia de contenidos](/servicios/estrategia-de-contenidos/) para que cada pieza ocupe su lugar en un cluster.

      Si quieres entender la lógica de agrupar temas, lee [qué es un topic cluster](/blog/que-es-un-topic-cluster/) y [cómo hacer keyword research](/blog/como-hacer-keyword-research/). La [guía de inicio de SEO de Google](https://developers.google.com/search/docs/fundamentals/seo-starter-guide) recuerda además que los buscadores encuentran páginas principalmente a través de enlaces, por eso cuidamos también los enlaces que apuntan a cada página que cambia.
