faq:
  - pregunta: "¿Siempre conviene actualizar en lugar de escribir algo nuevo?"
    respuesta: |
      No siempre. Si la página tiene un tema vigente y una base útil, actualizarla suele ser más rápido. Si el tema ya no encaja con tu negocio, es mejor retirarla. Para cubrir temas nuevos, usamos la [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/).
  - pregunta: "¿Eliminar páginas no perjudica mi sitio?"
    respuesta: |
      Depende de cómo se haga. Una página que se retira sin plan puede dejar enlaces rotos. Por eso cada eliminación lleva su redirección o su decisión documentada. La [guía de enlaces de Google](https://developers.google.com/search/docs/crawling-indexing/links-crawlable) explica cómo Google sigue los enlaces, y la tenemos en cuenta.
  - pregunta: "¿Cómo sé si dos de mis páginas compiten entre sí?"
    respuesta: |
      En Search Console puedes filtrar una búsqueda y ver qué páginas aparecen para ella. Si salen dos o más URL de tu sitio, hay un posible choque. Si prefieres que lo revisemos, es parte de este servicio y del trabajo de [investigación de palabras clave](/servicios/investigacion-de-palabras-clave/).
  - pregunta: "¿Qué tan seguido conviene revisar el contenido existente?"
    respuesta: |
      Depende del ritmo de cambio de tu sector y del tamaño del sitio. En la [estrategia de contenidos](/servicios/estrategia-de-contenidos/) dejamos una rutina de revisión que tu equipo pueda sostener.
