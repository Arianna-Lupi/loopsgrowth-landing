faq:
  - pregunta: "¿Qué diferencia hay entre una lista de palabras clave y un mapa?"
    respuesta: |
      La lista dice qué frases existen. El mapa dice qué página trabaja cada una, con qué intención y qué acción hace falta. Sin esa asignación es fácil que dos páginas compitan por lo mismo. Si quieres ver cómo se arma paso a paso, el siguiente trabajo es la [estrategia de contenidos](/servicios/estrategia-de-contenidos/).
  - pregunta: "¿Sirve si mi sitio es nuevo y casi no tiene páginas?"
    respuesta: |
      Sí, y es el mejor momento. El mapa te dice qué páginas crear primero y evita que construyas contenido sin rumbo. Luego puedes pasar esas páginas a la [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/).
  - pregunta: "¿Y si ya tengo contenido publicado?"
    respuesta: |
      Entonces el mapa también revisa lo que ya existe. Detectamos páginas que compiten entre sí o que no responden a ninguna búsqueda clara, y proponemos actualizarlas o unirlas dentro de la [optimización de contenido existente](/servicios/optimizacion-de-contenido-existente/).
  - pregunta: "¿Cuánto tarda en verse el efecto?"
    respuesta: |
      La investigación es la base y no cambia tu posición por sí sola. El efecto llega cuando se publica y se mejora contenido siguiendo el mapa, y eso toma tiempo. Explicamos los plazos con realismo en [cuánto tarda el SEO](/blog/cuanto-tarda-el-seo/).
