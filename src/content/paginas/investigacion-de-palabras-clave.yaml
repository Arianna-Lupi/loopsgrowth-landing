title: "Investigación de palabras clave: de la lista al mapa"
description: "Investigación de palabras clave en español: intención de búsqueda, dificultad real y un mapa frase-página que evita que tus páginas compitan entre sí."
h1: "Investigación de palabras clave que termina en un mapa, no en un Excel"
intro: |
  Una lista de frases con volumen de búsqueda sirve poco si nadie decide qué página trabaja cada una. La investigación de palabras clave de Loops Growth parte de cómo busca tu cliente y termina en un mapa que asigna cada frase a una página concreta, existente o por crear.

  Trabajamos en español para empresas de LATAM, con una idea simple: antes de escribir o de tocar el sitio, tienes que saber qué intención hay detrás de cada búsqueda y qué página le corresponde. Ese orden evita trabajo repetido y páginas que compiten entre sí.
secciones:
  - titulo: Intención antes que volumen
    cuerpo: |
      Dos frases parecidas pueden pedir cosas distintas. Quien busca "qué es el SEO" quiere entender un concepto. Quien busca "agencia SEO para tienda online" quiere comparar proveedores. Si las mezclas en una sola página, no sirves bien a ninguna de las dos.

      Por eso clasificamos cada frase por lo que la persona intenta hacer: aprender, comparar, comprar o encontrar un lugar. Después revisamos qué tipo de páginas muestra hoy Google para esa búsqueda, porque ese resultado dice qué formato espera el usuario. Si ves guías largas, una ficha de producto no encaja. Si ves listados de comparación, un artículo de opinión tampoco.
  - titulo: Dificultad real, no solo un número
    cuerpo: |
      Las herramientas de SEO dan un puntaje de dificultad, pero ese puntaje no conoce tu negocio. Lo leemos junto con tres preguntas prácticas:

      - Quién ocupa hoy los primeros resultados y si su sitio se parece al tuyo.
      - Qué tan específica es la frase y cuánta competencia directa tiene en tu país.
      - Si ya tienes una página que se acerque a lo que pide la búsqueda.

      Con eso separamos las frases que conviene atacar primero de las que conviene dejar para cuando el sitio tenga más base. Google recomienda crear contenido pensado para las personas y no para manipular los rankings, como explica su guía de [contenido útil y centrado en las personas](https://developers.google.com/search/docs/fundamentals/creating-helpful-content). Elegir bien las frases es parte de ese enfoque.
  - titulo: El mapa frase-página y la canibalización
    cuerpo: |
      El entregable central es un mapa: una tabla donde cada frase queda asignada a una sola página, con su intención, su prioridad y la acción que corresponde (crear, actualizar o consolidar). Cuando dos páginas apuntan a la misma frase, compiten entre sí y ninguna rinde como podría. El mapa lo detecta antes de que ocurra.

      Ese mapa alimenta el resto del trabajo. Con él armamos la [estrategia de contenidos](/servicios/estrategia-de-contenidos/), decidimos qué piezas se escriben en la [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/) y qué páginas se revisan en la [optimización de contenido existente](/servicios/optimizacion-de-contenido-existente/).

      Si quieres el contexto general, empieza por [qué es el SEO y cómo funciona](/blog/que-es-seo-y-como-funciona/) y por [cuánto tarda el SEO](/blog/cuanto-tarda-el-seo/), para fijar expectativas realistas sobre los plazos.
  - titulo: Qué haces tú y qué hacemos nosotros
    cuerpo: |
      Tú aportas lo que solo tu equipo sabe: cómo hablan tus clientes, qué preguntas repiten en ventas, qué servicios quieres impulsar. Nosotros traducimos eso a búsquedas reales, revisamos los resultados y armamos el mapa.

      Antes de cerrar el mapa lo revisamos contigo, porque una frase con buen volumen que no corresponde a tu oferta es ruido. La [guía de inicio de Google sobre SEO](https://developers.google.com/search/docs/fundamentals/seo-starter-guide) insiste en pensar en lo que sería útil para los usuarios, y esa es la vara con la que filtramos.
