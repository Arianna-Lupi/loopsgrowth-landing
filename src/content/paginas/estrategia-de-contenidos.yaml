proceso:
  - titulo: Partir del mapa de frases
    texto: Usamos el mapa de palabras clave como base y revisamos qué temas ya cubre tu sitio y cuáles faltan.
  - titulo: Armar los clusters
    texto: Agrupamos los temas, definimos la página principal de cada grupo y los artículos que la apoyan.
  - titulo: Priorizar con tu equipo
    texto: Aplicamos los criterios de orden y ajustamos contigo lo que no encaja con tu oferta o tus tiempos.
  - titulo: Fijar el calendario y la revisión
    texto: Cerramos fechas, responsables y el flujo de aprobación, y dejamos todo en un documento que tu equipo usa.
faq:
  - pregunta: "¿Cuántos artículos necesito publicar por mes?"
    respuesta: |
      Depende de quién escribe, quién revisa y qué tan específico sea el tema. No existe un número mágico. Definimos un ritmo que tu equipo pueda sostener y lo ajustamos con el tiempo. Una cadencia menor con buena calidad rinde más que una mayor que se abandona.
  - pregunta: "¿Qué pasa si ya tengo un blog con muchos artículos?"
    respuesta: |
      Primero revisamos lo que existe. Algunas piezas se actualizan o se unen y otras sirven de base para un cluster, como se detalla en la [optimización de contenido existente](/servicios/optimizacion-de-contenido-existente/). No partimos de cero si no hace falta.
  - pregunta: "¿Quién decide qué se publica?"
    respuesta: |
      Tú. Nosotros proponemos el orden y preparamos las piezas, pero cada texto pasa por tu revisión antes de salir. Para ver cómo se evalúa una relación así, mira las [preguntas para hacer a una agencia SEO](/blog/preguntas-para-hacer-a-una-agencia-seo/).
  - pregunta: "¿Incluye escribir los artículos?"
    respuesta: |
      La estrategia define qué escribir y cuándo. La producción de cada pieza es el trabajo de [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/). Puedes contratar la estrategia sola y escribir con tu equipo, o trabajar ambas cosas juntas.
