description: "Arquitectura web y enlazado interno: estructura de categorías, páginas huérfanas y anclas, para llegar a lo importante en pocos clics."
h1: "Arquitectura web y enlazado interno: llegar a lo importante en pocos clics"
intro: |
  La arquitectura web es el orden de tus páginas: qué cuelga de qué, cómo se llega a cada una y qué enlaces las conectan. Cuando está bien pensada, una persona encuentra lo que busca sin esfuerzo y Google descubre tus páginas importantes con facilidad.

  En Loops Growth revisamos la estructura de tu sitio y el enlazado interno como una sola tarea. Trabajamos en español para empresas de LATAM, con cambios concretos que tu equipo puede aplicar.
secciones:
  - titulo: Estructura de categorías
    cuerpo: |
      Una buena estructura agrupa tus páginas por temas que un cliente reconoce. En una tienda, eso pueden ser categorías y subcategorías con nombres claros. En un sitio de servicios, una página por servicio y un blog ordenado por temas.

      Buscamos que las páginas más valiosas estén a pocos clics de la portada y que cada una tenga un lugar lógico. Las URL también cuentan: la [guía de inicio de SEO de Google](https://developers.google.com/search/docs/fundamentals/seo-starter-guide) recomienda incluir palabras útiles para las personas y evitar identificadores aleatorios.

      Esa estructura se apoya en lo que ya definimos en la [estrategia de contenidos](/servicios/estrategia-de-contenidos/), donde los clusters de temas sirven de esqueleto para las secciones del sitio.
  - titulo: Páginas huérfanas
    cuerpo: |
      Una página huérfana es una página a la que ningún otro enlace del sitio apunta. Aunque exista, es difícil que alguien la encuentre, y Google tiene menos pistas para descubrirla. La documentación de Google sobre [enlaces rastreables](https://developers.google.com/search/docs/crawling-indexing/links-crawlable) recomienda que cada página que te importe reciba un enlace desde al menos otra página de tu sitio.

      Para encontrarlas comparamos la lista de URL de tu sitio con las que reciben enlaces internos al rastrearlo. Las que no aparecen se revisan una a una: algunas necesitan enlaces, otras se unen a una página más fuerte y otras sobran. Ese último caso se coordina con la [optimización de contenido existente](/servicios/optimizacion-de-contenido-existente/).
  - titulo: Anclas que dicen algo
    cuerpo: |
      El ancla es el texto del enlace. Google indica que un buen ancla es descriptivo, razonablemente breve y relevante para la página a la que lleva. "Haz clic aquí" no dice nada, mientras que "guía de [qué es un topic cluster](/blog/que-es-un-topic-cluster/)" sí.

      También revisamos que los enlaces sean realmente enlaces: Google solo puede rastrear los que son elementos con atributo de destino. Un botón que navega con script puede verse bien para una persona y ser invisible para el buscador.
  - titulo: Enlazado que acompaña al contenido
    cuerpo: |
      Cada pieza nueva sale con sus enlaces ya pensados, como se hace en la [redacción de artículos SEO](/servicios/redaccion-de-articulos-seo/), y las piezas antiguas reciben enlaces hacia ellas cuando se publican temas relacionados. Así la estructura se mantiene viva y no depende de una revisión puntual.

      Para ordenar qué enlaza a qué usamos el [mapa de palabras clave](/servicios/investigacion-de-palabras-clave/), que dice qué página trabaja cada tema. Si quieres el fondo teórico, lee [cómo hacer keyword research](/blog/como-hacer-keyword-research/).
senales:
  - "Para llegar a una página importante hacen falta muchos clics desde la portada."
