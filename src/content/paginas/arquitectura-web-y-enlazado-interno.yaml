faq:
  - pregunta: "¿Cuántos clics debería haber hasta una página importante?"
    respuesta: |
      No existe un número oficial que Google exija. La idea práctica es que tus páginas más valiosas se alcancen con pocos pasos y tengan enlaces desde otras páginas. Lo revisamos según el tamaño y el tipo de tu sitio.
  - pregunta: "¿Necesito un sitemap si ya tengo buen enlazado?"
    respuesta: |
      Google indica que un sitemap no es obligatorio y que encuentra páginas sobre todo a través de enlaces. Un buen enlazado interno sigue siendo la base. Un sitemap puede complementarlo, pero no lo reemplaza.
  - pregunta: "¿Este trabajo cambia las URL de mi sitio?"
    respuesta: |
      Solo cuando hay una razón clara. Cambiar una URL exige redirecciones para no perder enlaces, así que lo evitamos si no aporta valor. Cuando hace falta, lo coordinamos con la [optimización de contenido existente](/servicios/optimizacion-de-contenido-existente/).
  - pregunta: "¿Cómo se relaciona con los clusters de contenido?"
    respuesta: |
      Los clusters definen qué temas existen y cómo se agrupan. La arquitectura los traduce en secciones y enlaces concretos del sitio. Se explican en la [estrategia de contenidos](/servicios/estrategia-de-contenidos/) y en [qué es un topic cluster](/blog/que-es-un-topic-cluster/).
