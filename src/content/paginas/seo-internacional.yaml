h1: "SEO internacional: un sitio para varios países hispanos"
intro: |
  Vender en México, Colombia, Chile y España con el mismo idioma parece simple, pero genera una pregunta técnica: cómo le explicas a Google qué página corresponde a qué país sin que se canibalicen entre sí. El SEO internacional resuelve esa estructura.

  En Loops Growth definimos contigo qué se comparte en español neutro, qué se adapta a cada mercado y cómo se señala todo para los buscadores.
secciones:
  - titulo: Hreflang, la señal que conecta las versiones
    cuerpo: |
      Hreflang indica a Google qué versión de una página corresponde a cada idioma o región. La [documentación oficial de Google](https://developers.google.com/search/docs/specialty/international/localized-versions) detalla las reglas que más fallan:

      - Se puede implementar en etiquetas HTML, en cabeceras HTTP o en el sitemap, y Google considera equivalentes los tres métodos.
      - Los enlaces deben ser recíprocos: si la página X apunta a Y, Y debe apuntar a X, o Google ignora la anotación.
      - Cada versión debe incluir un enlace a sí misma y el mismo conjunto de enlaces que las demás.
      - El código de región no puede usarse solo; va siempre junto al idioma, por ejemplo es-mx.
      - x-default marca la versión de respaldo para quien no coincide con ninguna.

      Detectar errores de reciprocidad es de lo primero que revisamos.
  - titulo: Español neutro o variantes locales
    cuerpo: |
      Con un mismo idioma, no siempre conviene duplicar cada página por país. Google contempla anotar pequeñas variaciones regionales dentro de un idioma, como inglés para Estados Unidos, Reino Unido e Irlanda, y la misma lógica sirve para el español.

      Nuestro criterio de trabajo: se comparte una versión en español neutro cuando la oferta, la moneda y las condiciones son las mismas, y se separa por país cuando cambian el producto, las condiciones de entrega, el lenguaje comercial o la normativa. Conviene también revisar el vocabulario con el que busca cada mercado, algo que aterrizamos en la [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/) y en la investigación de palabras clave.
  - titulo: Estructura de URL
    cuerpo: |
      Tienes tres caminos: dominios por país, subdominios o subdirectorios. Google aclara que las versiones alternativas no tienen que compartir dominio, pero en la documentación consultada no compara las ventajas de cada estructura, así que no la tratamos como un asunto de ranking.

      Elegimos según tu operación: quién administra cada mercado, cuántos equipos publican y cómo está montado el sitio. Lo importante es que la estructura se mantenga estable, porque cambiarla después es una [migración SEO](/servicios/migracion-seo/).
  - titulo: Qué se duplica y qué se separa
    cuerpo: |
      Duplicar una página para cinco países sin cambiar nada produce versiones casi idénticas que compiten entre sí. Para cada tipo de página decidimos si se comparte, se adapta o se separa, y definimos canonicals y hreflang coherentes.

      Después verificamos que cada versión se pueda descubrir y se indexe. Ese control se apoya en [indexación y rastreo](/servicios/indexacion-y-rastreo/), y la velocidad de cada versión se revisa en [Core Web Vitals](/servicios/core-web-vitals/). Para el punto de partida, revisa [cómo indexar una página en Google](/blog/como-indexar-una-pagina-en-google/) y [Core Web Vitals: qué son](/blog/core-web-vitals-que-son/).
