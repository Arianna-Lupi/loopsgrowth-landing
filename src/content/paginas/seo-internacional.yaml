faq:
  - pregunta: "¿Necesito una página distinta para cada país hispano?"
    respuesta: |
      No siempre. Si la oferta y las condiciones son iguales, puede bastar una versión en español neutro. Se separa cuando cambian el producto, la entrega o la normativa. Lo definimos en la [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/) del sitio.
  - pregunta: "¿Qué código uso para el español de toda Latinoamérica?"
    respuesta: |
      Google exige códigos ISO 639-1 para el idioma y ISO 3166-1 Alpha 2 para la región, y indica que no admite códigos no estándar como es-419. Puedes usar es para el idioma sin región, o es más el país. Está en su [guía de versiones localizadas](https://developers.google.com/search/docs/specialty/international/localized-versions).
  - pregunta: "¿Dominio por país, subdominio o subdirectorio?"
    respuesta: |
      Depende de tu operación y de tu equipo. La documentación de Google no compara las tres opciones. Lo importante es elegir una estructura estable, porque cambiarla después implica una [migración SEO](/servicios/migracion-seo/).
  - pregunta: "¿Cómo compruebo que Google indexa cada versión?"
    respuesta: |
      Con Search Console y un rastreo propio, revisando cada versión por separado. Ese seguimiento forma parte de [indexación y rastreo](/servicios/indexacion-y-rastreo/), y la velocidad por versión se mide en [Core Web Vitals](/servicios/core-web-vitals/).
