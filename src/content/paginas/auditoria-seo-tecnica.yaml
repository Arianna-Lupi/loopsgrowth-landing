faq:
  - pregunta: "¿En qué se diferencia una auditoría técnica de una auditoría SEO completa?"
    respuesta: |
      La auditoría técnica mira cómo Google accede a tu sitio y lo procesa: rastreo, indexación, velocidad y datos estructurados. Una auditoría completa suma contenido, autoridad y estrategia. Muchos proyectos empiezan por la técnica porque es la base: si el sitio no se rastrea bien, el resto rinde menos. Para ver cómo encaja todo, lee [qué es SEO y cómo funciona](/blog/que-es-seo-y-como-funciona/).
  - pregunta: "¿Cuánto tarda en verse el efecto de las correcciones?"
    respuesta: |
      Depende del tamaño del sitio, de la frecuencia con que Google lo rastrea y de cuándo tu equipo publique los cambios. Nadie puede fijar un plazo exacto. Explicamos los factores en [cuánto tarda el SEO en dar resultados](/blog/cuanto-tarda-el-seo/).
  - pregunta: "¿Necesito acceso a mi sitio para auditarlo?"
    respuesta: |
      Necesitamos acceso de lectura a Search Console y, si existe, a tu analítica. El rastreo lo hacemos desde afuera. No modificamos nada en tu sitio: las correcciones las aplica tu equipo o tu proveedor con nuestras especificaciones.
  - pregunta: "¿La auditoría incluye la velocidad del sitio?"
    respuesta: |
      Sí, como una de las cuatro áreas. Si la velocidad es tu principal preocupación, el servicio de [Core Web Vitals](/servicios/core-web-vitals/) profundiza en LCP, INP y CLS. Y si tu duda es por qué Google no indexa páginas, mira [indexación y rastreo](/servicios/indexacion-y-rastreo/).
