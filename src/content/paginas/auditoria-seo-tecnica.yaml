title: "Auditoría SEO técnica por plantillas de página"
description: "Auditoría SEO técnica que revisa rastreo, indexación, velocidad y datos estructurados por plantilla, con un informe priorizado por impacto y esfuerzo."
h1: "Auditoría SEO técnica: diagnóstico por plantillas de página"
intro: |
  Una auditoría SEO técnica responde una pregunta concreta: qué impide que Google rastree, entienda e indexe las páginas que te importan. La respuesta casi nunca está en una URL aislada. Está en la plantilla que la genera.

  En Loops Growth auditamos por plantillas: la ficha de producto, la categoría, el artículo, la página de servicio. Un solo problema en una plantilla se repite en cientos de páginas, y corregirlo una vez limpia todas. Así el informe que recibes es corto, ordenado y accionable.
secciones:
  - titulo: Por qué auditamos por plantilla y no URL por URL
    cuerpo: |
      Revisar página por página produce hojas de cálculo enormes que nadie termina de leer. Muchos sitios, además, generan sus páginas desde pocas plantillas: si el título se duplica en la plantilla de categoría, se duplica en todas las categorías.

      Por eso agrupamos las URL por tipo, revisamos una muestra representativa de cada grupo y confirmamos el hallazgo con datos de Search Console y de un rastreo completo. El resultado es una lista de causas, no una lista de síntomas.

      Si tu duda es cuánto tarda en notarse una corrección técnica, lee [cuánto tarda el SEO en dar resultados](/blog/cuanto-tarda-el-seo/).
  - titulo: Qué revisamos en la auditoría
    cuerpo: |
      Cubrimos cuatro frentes, siempre sobre las plantillas que más pesan en tu negocio:

      - Rastreo: archivo robots.txt, códigos de respuesta, cadenas de redirecciones y enlaces internos rotos. Detalle en nuestro servicio de [indexación y rastreo](/servicios/indexacion-y-rastreo/).
      - Indexación: etiquetas noindex, canonicals, duplicados y lo que Search Console informa como no indexado.
      - Velocidad: LCP, INP y CLS con datos de campo. Lo desarrollamos en [Core Web Vitals](/servicios/core-web-vitals/).
      - Datos estructurados: que el marcado sea válido y coincida con lo que muestra la página.

      Cuando el sitio va a cambiar de dominio, de CMS o de diseño, la auditoría se convierte en el punto de partida de una [migración SEO](/servicios/migracion-seo/).
  - titulo: Cómo ordenamos el informe
    cuerpo: |
      Cada hallazgo lleva tres datos: cuántas páginas afecta, qué tan grave es para el rastreo o la indexación y cuánto esfuerzo de desarrollo exige. Con eso armamos una cola de trabajo. Primero van los cambios de alto impacto y poco esfuerzo; al final, los que conviene planificar con el equipo técnico.

      Cada punto incluye la evidencia, la plantilla afectada y la corrección que proponemos, escrita para que un desarrollador la aplique sin llamadas de aclaración. Si quieres entender el marco general antes, empieza por [qué es SEO y cómo funciona](/blog/que-es-seo-y-como-funciona/).
senales:
  - "Publicas páginas nuevas y Google tarda semanas en mostrarlas, o no las muestra."
  - "Search Console informa muchas URL como rastreadas o descubiertas sin indexar."
  - "Tu tráfico cayó después de un rediseño, un cambio de plugin o una actualización del sitio."
  - "Nadie en tu equipo sabe cuántas plantillas tiene el sitio ni qué etiquetas usa cada una."
  - "Tu agencia anterior entregó un reporte de cientos de filas y ninguna prioridad."
