h1: "Optimización para AI Overviews: lo que Google documenta y lo que no"
intro: |
  Las AI Overviews son los resúmenes que Google muestra en la parte superior de algunas búsquedas, con enlaces a las páginas que apoyan la respuesta. Aparecer como uno de esos enlaces es posible, pero nadie puede asegurarlo ni comprarlo.

  En Loops Growth preparamos tu sitio con lo que Google dice por escrito y no inventamos fórmulas. Trabajamos en español y para empresas de LATAM, junto con tu SEO y con el resto de tu [posicionamiento en IA](/servicios/posicionamiento-en-ia/).
secciones:
  - titulo: Lo que Google documenta
    cuerpo: |
      Según la guía de Google sobre las [funciones de IA en Search](https://developers.google.com/search/docs/appearance/ai-features), para aparecer como enlace de apoyo una página debe estar indexada y ser elegible para mostrarse en Google Search con un fragmento. Google afirma que no hay requisitos técnicos adicionales.

      La misma guía dice que no hace falta crear archivos nuevos para máquinas, archivos de texto para IA ni marcado especial, y que no existe un schema.org específico que haya que añadir. Tampoco asegura la inclusión: Google aclara que indexar y mostrar una página no está asegurado.
  - titulo: Lo que Google no documenta
    cuerpo: |
      La guía de Google no enumera factores que decidan qué página entra en un resumen concreto, ni cuántas veces aparecerá. Cualquiera que te venda una fórmula exacta está afirmando algo que no puede demostrar con la documentación oficial.

      Por eso en este servicio separamos dos cosas. Lo que está documentado lo aplicamos y lo verificamos. Lo que es una hipótesis, por ejemplo qué tipo de formato de respuesta se cita más, lo probamos con tus páginas y lo tratamos como una prueba, no como una regla.
  - titulo: Qué preparamos en la práctica
    cuerpo: |
      Con lo documentado como base, el trabajo se concentra en cuatro puntos:

      - Que tus páginas importantes estén indexadas, con un fragmento posible y sin bloqueos por error. Google menciona controles como `nosnippet`, `max-snippet` y `noindex`, y revisamos que no los tengas en páginas que quieres mostrar.
      - Que cada página responda con claridad la pregunta que atiende, con una respuesta directa al comienzo y el detalle después.
      - Que la información de tu empresa coincida entre tu sitio y tus perfiles públicos.
      - Que la página tenga autoría visible y datos que se puedan comprobar.

      Estos puntos son las bases del SEO, y Google dice que sigue aplicando sus fundamentos a estas funciones.
  - titulo: Cómo se relaciona con el resto de tu visibilidad en IA
    cuerpo: |
      Las AI Overviews son una de varias superficies. ChatGPT y Perplexity funcionan con sus propios rastreadores y criterios, y lo explicamos en [optimización para ChatGPT y Perplexity](/servicios/optimizacion-para-chatgpt-y-perplexity/). Si quieres entender los términos, tenemos guías sobre [qué es AEO](/blog/que-es-aeo/) y [qué es GEO](/blog/que-es-geo-optimizacion-para-motores-generativos/).

      Para saber si lo que haces se refleja, usamos la [medición de menciones en IA](/servicios/medicion-de-menciones-en-ia/), con una batería fija de preguntas que repetimos cada mes.
