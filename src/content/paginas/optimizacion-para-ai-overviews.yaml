faq:
  - pregunta: "¿Hay que añadir marcado especial para aparecer en AI Overviews?"
    respuesta: |
      Según Google, no. Su [guía oficial](https://developers.google.com/search/docs/appearance/ai-features) indica que no hace falta marcado especial ni archivos nuevos y que no hay un schema.org específico para estas funciones. Nuestro trabajo se centra en lo que sí documenta.
  - pregunta: "¿Pueden asegurar que mi página aparezca en un resumen de IA?"
    respuesta: |
      No. Google aclara que la inclusión no está asegurada y su guía no enumera factores que la determinen, y nadie fuera de Google puede asegurarlo. Lo que hacemos es cumplir lo documentado y medir cada mes si se refleja.
  - pregunta: "¿Es distinto de hacer SEO?"
    respuesta: |
      Se apoya en el SEO, no lo sustituye. Una página que Google no indexa no puede mostrarse como enlace de apoyo. Por eso lo trabajamos junto con el resto de tu [posicionamiento en IA](/servicios/posicionamiento-en-ia/).
  - pregunta: "¿Cómo sé si estoy apareciendo?"
    respuesta: |
      Repetimos cada mes una batería fija de preguntas y anotamos si tus páginas aparecen como enlace. Es parte de la [medición de menciones en IA](/servicios/medicion-de-menciones-en-ia/). Como las respuestas cambian, miramos la tendencia y no una sola consulta.
