proceso:
  - titulo: Lectura del informe de Search Console
    texto: Clasificamos las URL por estado de indexación y separamos errores reales de decisiones normales de Google.
  - titulo: Rastreo propio del sitio
    texto: Rastreamos el sitio como lo haría un buscador para comparar lo que ve con lo que informa Search Console.
  - titulo: Corrección y verificación
    texto: Tu equipo aplica los cambios con nuestras especificaciones y nosotros inspeccionamos las URL clave para confirmarlos.
  - titulo: Vigilancia continua
    texto: Revisamos los estados de indexación con una frecuencia acordada y avisamos si aparece un patrón nuevo.
faq:
  - pregunta: "¿Por qué Google no indexa mis páginas aunque estén publicadas?"
    respuesta: |
      Puede ser un bloqueo técnico, una señal contradictoria o una decisión de Google tras rastrear la página. Search Console indica el motivo por grupo de URL. Tienes los pasos básicos en [cómo indexar una página en Google](/blog/como-indexar-una-pagina-en-google/).
  - pregunta: "¿Puedo forzar que Google indexe una página?"
    respuesta: |
      Puedes solicitar una revisión con la herramienta de inspección de URL, pero Google decide si indexa. Por eso corregimos la causa, no solo pedimos reindexación. El diagnóstico completo entra en una [auditoría SEO técnica](/servicios/auditoria-seo-tecnica/).
  - pregunta: "¿Mi sitio necesita preocuparse por el crawl budget?"
    respuesta: |
      Según Google, esa guía se dirige a sitios muy grandes o con cambios diarios y muchas páginas. En los demás casos, basta con un sitemap actualizado y revisar el informe de indexación.
  - pregunta: "¿Qué relación tiene esto con una migración o con la velocidad?"
    respuesta: |
      En una [migración SEO](/servicios/migracion-seo/) los problemas de indexación suelen aparecer justo después del cambio. Y la velocidad, que cubrimos en [Core Web Vitals](/servicios/core-web-vitals/), mejora la experiencia de las páginas que ya están en el índice.
