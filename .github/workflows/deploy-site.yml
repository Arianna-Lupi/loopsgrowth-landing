name: Deploy sitio a Hostinger

# Cada push a main compila la landing, pasa las guardas y sube dist/ por FTP a Hostinger.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # HOSTINGER=1 desactiva los bloqueos de check-copy y check-photos (los textos pendientes y las
      # fotos sin aprobar no bloquean el hosting), igual que en el despliegue anterior.
      - name: Build de producción
        run: npm run build
        env:
          HOSTINGER: '1'
          PUBLIC_ENV: production
          PUBLIC_SITE_URL: https://loopsgrowth.com

      - name: Guardas (contraste, copy, presupuestos, movimiento)
        run: npm run test:guards

      - name: Subir dist/ a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
